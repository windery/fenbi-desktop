[package]
name = "fenbi-desktop"
version = "0.1.2"
description = "粉笔刷题桌面 wrapper（macOS / Windows / Linux）"
authors = ["huanglang"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "fenbi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 精确钉死：多 WebView 布局（Window::add_child / set_bounds）靠的是 `unstable`
# feature，Tauri 不对它做 semver 承诺，升级要人工验证工具栏与内容区布局。
tauri = { version = "=2.11.5", features = ["unstable"] }
# 只用于把跳转目标序列化成 JS 字符串字面量，见 lib.rs 的 build_window
serde_json = "1"
# 记住窗口尺寸/位置/最大化状态。2.5 起要求 tauri 2.12，所以同样钉死。
tauri-plugin-window-state = "=2.4.0"

# Linux 上 tauri-runtime-wry 把子 WebView pack 进窗口的 GtkBox，`set_bounds` 是空操作，
# 布局要直接改 GTK packing（见 toolbar.rs 的 linux 版 layout）。版本与 tauri 用的一致。
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
