<!-- 站点真实做法：登录框常驻 DOM，靠 display 控制显隐。
     data-invisible 表示此刻不可见 —— 不可见的登录框不算"已经弹出来了"，
     脚本必须继续把登录框点出来，否则用户永远看不到登录入口。 -->
<div class="nav-header-content">
  <nav class="fb-web-nav"><a href="/">首页</a></nav>
  <div class="header-content-logon">
    <button class="header-content-logon-btn">登录</button>
    <div class="login-web-modal" data-invisible>
      <input placeholder="手机号" />
    </div>
  </div>
</div>
