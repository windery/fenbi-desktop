name: release

# 打 tag 触发发布：
#   git tag v0.1.0 && git push origin v0.1.0
#
# 会构建 macOS（ARM64 + x64）/ Linux / Windows 并创建 GitHub Release
# （草稿状态，需要你去 Releases 页面点 Publish）。
#
# 注意：Release 的 tag 名取自触发它的 ref，所以**必须用 tag 触发**。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false # 一个平台失败不影响其他平台出包
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            label: macOS-ARM64
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            label: macOS-x64
          - platform: ubuntu-22.04
            args: ""
            label: Linux-x64
          - platform: windows-latest
            # 只出 NSIS，不出 MSI：WiX v3 的 light.exe 处理非 ASCII 产品名
            # （粉笔刷题）会失败：
            #   Running light to produce ...\粉笔刷题_0.1.0_x64_en-US.msi
            #   failed to run ...\WixTools314\light.exe
            # NSIS 对 Unicode 支持正常。
            args: "--bundles nsis"
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      # Tauri 在 Linux 上用的是系统 WebKitGTK，需要这些开发包
      - name: 安装 Linux 依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 要出 ARM64 + x64 两个包，因此需要两个 target
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # 必须 >= 22.13：package.json 里声明的 pnpm@11 要求这个下限，
          # 用 Node 20 会在 setup-node 的 cache 步骤报
          # "This version of pnpm requires at least Node.js v22.13"
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # tauri-action 会执行 pnpm tauri build，并把各平台产物挂到 Release 上
      - name: 构建并创建 Release（草稿）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "粉笔刷题 ${{ github.ref_name }}"
          # 可用占位符（以 action.yml 为准，README 有滞后）：
          #   [name] [version] [platform] [arch] [ext] [mode] [setup] [_setup] [bundle]
          # 注意 [mainBinaryName] 在当前 release 的 action 里不被支持，
          # 会被当字面量原样输出。这里用 [name]（productName）作基名。
          # 中文的 productName 只在"应用显示名"里保留，下载文件名走 ASCII。
          assetNamePattern: "fenbi-desktop_[version]_[platform]_[arch][setup].[ext]"
          releaseBody: |
            粉笔题库桌面版。三平台产物见下方 Assets。

            ## 安装

            **macOS**：下载 `.dmg`，拖进「应用程序」。
            未签名，首次打开需**右键 →「打开」**，或执行：
            `xattr -dr com.apple.quarantine /Applications/粉笔刷题.app`

            **Windows**：下载 `.exe` 安装。
            未签名，SmartScreen 提示时点「更多信息」→「仍要运行」。

            **Linux**：`.AppImage` 加执行权限直接运行；`.deb` / `.rpm` 用系统包管理器装。

            ## 用法

            打开即进题库目录页，上次选的分类会自动恢复。
            未登录会弹登录框，登录一次后长期有效。
            快捷键 `Cmd/Ctrl + R` 刷新页面。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
