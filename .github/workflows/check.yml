name: check

# PR 与普通分支推送的日常检查。
# tag 推送不在这里 —— 发布走 release.yml，它自己会先校验版本号一致再构建。
on:
  pull_request:
  push:
    branches: ["**"]

# PR 检查不需要任何写权限
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 检查与测试
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Tauri 在 Linux 上用的是系统 WebKitGTK，需要这些开发包
      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # pnpm check 里用到了 rustfmt 与 clippy
          components: clippy, rustfmt

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # 必须 >= 22.13：package.json 里声明的 pnpm@11 要求这个下限
          node-version: 22
          cache: pnpm

      # 用锁文件安装，保证 CI 与本地的依赖完全一致；改了依赖要一并提交锁文件
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 与本地同一个入口：JS 语法 + Rust 格式/静态检查 + 全部测试
      - name: 检查与测试
        run: pnpm check

  # 只做**编译**检查，覆盖 Linux 之外的平台。
  # 这不等于 UI 冒烟测试：真机运行验证见 CONTRIBUTING.md「平台支持」。
  compile:
    name: 编译检查（${{ matrix.label }}）
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS
          - platform: windows-latest
            label: Windows
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # `tauri::generate_context!` 在编译期就要读 frontendDist，
      # 而 dist/ 是被 gitignore 的，所以先复制本地工具栏资源到 dist/
      - name: 准备工具栏资源
        run: pnpm build

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
