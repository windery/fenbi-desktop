name: check

# PR 与普通分支推送的日常检查。
# tag 推送不在这里 —— 发布走 release.yml，它自己会先校验版本号一致再构建。
# pull_request 已覆盖所有 PR 分支；push 只盯默认分支，避免同一次推送跑两遍。
on:
  pull_request:
  push:
    branches: ["main"]

# PR 检查不需要任何写权限
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 判断是否需要跨平台编译
    runs-on: ubuntu-22.04
    outputs:
      compile: ${{ steps.diff.outputs.compile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: diff
        name: 检查改动范围
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # 推送比较前后两棵树；PR 只看分叉后的改动，不计入基线独有的提交。
          range="$BASE..$HEAD_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            range="$BASE...$HEAD_SHA"
          fi

          paths=$(mktemp)
          trap 'rm -f -- "$paths"' EXIT
          compile=true
          # 无法比较或改动为空时保留编译。禁用重命名识别，逐一检查旧/新路径。
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             git diff --no-renames --name-only -z "$range" -- > "$paths" &&
             [[ -s "$paths" ]]; then
            compile=false
            while IFS= read -r -d '' path; do
              case "$path" in
                AGENTS.md|CLAUDE.md|README.md|CONTRIBUTING.md|GLOSSARY.md|tests/README.md|docs/*.md|docs/*.png|docs/*.jpg|docs/*.jpeg)
                  ;;
                *)
                  compile=true
                  break
                  ;;
              esac
            done < "$paths"
          fi
          echo "compile=$compile" >> "$GITHUB_OUTPUT"

  test:
    name: 检查与测试
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Tauri 在 Linux 上用的是系统 WebKitGTK，需要这些开发包
      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # pnpm check 里用到了 rustfmt 与 clippy
          components: clippy, rustfmt

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # 必须 >= 22.13：package.json 里声明的 pnpm@11 要求这个下限
          node-version: 22
          cache: pnpm

      # 用锁文件安装，保证 CI 与本地的依赖完全一致；改了依赖要一并提交锁文件
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 与本地同一个入口：JS 语法 + Rust 格式/静态检查 + 全部测试
      - name: 检查与测试
        run: pnpm check

  # 编译 + 单元测试，覆盖 Linux 之外的平台。Rust 测试全是纯函数，不开窗口，
  # 所以在这里顺手跑一遍成本很低。这不等于 UI 冒烟测试：真机运行验证见
  # CONTRIBUTING.md「平台支持」。
  compile:
    needs: changes
    # 仅在明确判定为纯文档时跳过；判定步骤失败也不能漏掉编译。
    if: ${{ !cancelled() && needs.changes.outputs.compile != 'false' }}
    name: 编译与测试（${{ matrix.label }}）
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS
          - platform: windows-latest
            label: Windows
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # `tauri::generate_context!` 在编译期就要读 frontendDist，
      # 而 dist/ 是被 gitignore 的，所以先复制本地工具栏资源到 dist/
      - name: 准备工具栏资源
        run: pnpm build

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
